# Include INSIDE existing aiheadshotapi.com SSL server { } block
# (baaki nginx sites ko mat hatayo — sirf ye lines add karo)
#
#   include /var/www/headshot-api/deploy/nginx/headshot-api-locations.conf;
#
# PM2 must run: 127.0.0.1:3016

location /uploads/ {
    alias /var/www/headshot-api/uploads/;
    expires 7d;
}

location /generated/ {
    alias /var/www/headshot-api/generated/;
    expires 1d;
}

location /docs {
    proxy_pass http://127.0.0.1:3016;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /v1/ {
    proxy_pass http://127.0.0.1:3016;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
