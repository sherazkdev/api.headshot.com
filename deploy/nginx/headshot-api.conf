# /etc/nginx/sites-available/headshot-api
# API: /v1/, /docs  |  Admin dashboard: /, /login, /_next/, etc.

upstream headshot_api {
    server 127.0.0.1:3016;
}

upstream headshot_admin {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiheadshotapi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aiheadshotapi.com;

    ssl_certificate     /etc/letsencrypt/live/aiheadshotapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiheadshotapi.com/privkey.pem;

    client_max_body_size 105m;

    access_log /var/www/headshot-api/logs/nginx.access.log;
    error_log  /var/www/headshot-api/logs/nginx.error.log;

    location /uploads/ {
        alias /var/www/headshot-api/uploads/;
    }

    location /generated/ {
        alias /var/www/headshot-api/generated/;
    }

    location /v1/ {
        proxy_pass http://headshot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /docs {
        proxy_pass http://headshot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass http://headshot_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://headshot_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
