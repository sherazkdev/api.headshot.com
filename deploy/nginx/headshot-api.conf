# /etc/nginx/sites-available/headshot-api
# cp /var/www/headshot-api/deploy/nginx/headshot-api.conf /etc/nginx/sites-available/headshot-api
# ln -sf /etc/nginx/sites-available/headshot-api /etc/nginx/sites-enabled/headshot-api
# nginx -t && nginx -s reload

upstream headshot_api {
    server 127.0.0.1:3016;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiheadshotapi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aiheadshotapi.com;

    ssl_certificate     /etc/letsencrypt/live/aiheadshotapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiheadshotapi.com/privkey.pem;

    client_max_body_size 105m;

    access_log /var/www/headshot-api/logs/nginx.access.log;
    error_log  /var/www/headshot-api/logs/nginx.error.log;

    location /uploads/ {
        alias /var/www/headshot-api/uploads/;
    }

    location /generated/ {
        alias /var/www/headshot-api/generated/;
    }

    location / {
        proxy_pass http://headshot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
