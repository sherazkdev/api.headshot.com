# Headshot API — nginx reverse proxy (port 3016)
# Install: sudo cp deploy/nginx/headshot-api.conf /etc/nginx/sites-available/headshot-api
#          sudo ln -sf /etc/nginx/sites-available/headshot-api /etc/nginx/sites-enabled/headshot-api
#          sudo nginx -t && sudo systemctl reload nginx
#
# Prereqs: Node API on 127.0.0.1:3000 (PORT=3000), MongoDB running.
# Check port 3016 is free: bash deploy/nginx/check-port-3016.sh

upstream headshot_api_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 3016;
    listen [::]:3016;
    server_name _;

    # Match MAX_UPLOAD_MB (default 10) with headroom for multipart overhead
    client_max_body_size 12m;

    access_log /var/log/nginx/headshot-api.access.log;
    error_log  /var/log/nginx/headshot-api.error.log warn;

    # Generated images & uploads (optional direct serve; API still works without this)
    location /uploads/ {
        alias /var/www/headshot-api/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /generated/ {
        alias /var/www/headshot-api/generated/;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Swagger / OpenAPI
    location /docs {
        proxy_pass http://headshot_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API (/v1/...)
    location / {
        proxy_pass http://headshot_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # AI jobs (headshot + branding improve) can take up to ~3 minutes
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        send_timeout          180s;
    }
}
