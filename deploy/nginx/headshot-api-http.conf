# Step 1 — SSL certificate se PEHLE (nginx -t pass hone ke liye)
# cp deploy/nginx/headshot-api-http.conf /etc/nginx/sites-available/headshot-api
# nginx -t && nginx -s reload
# certbot certonly --webroot -w /var/www/headshot-api/logs/certbot -d aiheadshotapi.com
# Step 2 — certificate ke baad full SSL:
# cp deploy/nginx/headshot-api.conf /etc/nginx/sites-available/headshot-api
# nginx -t && nginx -s reload

upstream headshot_api {
    server 127.0.0.1:3016;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiheadshotapi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/headshot-api/logs/certbot;
    }

    location / {
        proxy_pass http://headshot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
